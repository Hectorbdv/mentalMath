<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Operaciones</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #151515;
      --muted: #8a857c;
      --panel: rgba(244, 241, 234, 0.78);
      --line: rgba(21, 21, 21, 0.14);
    }

    body.dark {
      --bg: #11100e;
      --ink: #f0ece3;
      --muted: #8e887d;
      --panel: rgba(17, 16, 14, 0.78);
      --line: rgba(240, 236, 227, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      transition:
        background-color 520ms ease,
        color 520ms ease;
    }

    body {
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      padding:
        max(28px, env(safe-area-inset-top))
        max(26px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(26px, env(safe-area-inset-left));
    }

    .timer {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      right: max(24px, env(safe-area-inset-right));
      z-index: 20;
      padding: 8px 0 8px 14px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      opacity: 1;
      transition: opacity 320ms ease, color 520ms ease;
    }

    .timer.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .practice {
      grid-row: 2;
      width: min(100%, 860px);
      margin: 0 auto;
      text-align: left;
      display: grid;
      grid-template-rows: 26px 150px 92px;
      align-items: center;
    }

    .label {
      align-self: start;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 520ms ease;
    }

    .operation {
      align-self: end;
      width: 100%;
      font-size: clamp(58px, 17vw, 148px);
      font-weight: 300;
      letter-spacing: -0.078em;
      line-height: 0.88;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: color 520ms ease, opacity 260ms ease;
    }

    .result {
      align-self: start;
      margin-top: 34px;
      font-size: clamp(34px, 8.5vw, 76px);
      font-weight: 300;
      letter-spacing: -0.055em;
      color: var(--muted);
      min-height: 1em;
      font-variant-numeric: tabular-nums;
      transition: color 520ms ease, opacity 220ms ease;
    }

    .hint {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: max(26px, env(safe-area-inset-left));
      z-index: 10;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 1;
      transition: opacity 700ms ease, color 520ms ease;
    }

    .hint.hidden {
      opacity: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease;
    }

    body.dark .overlay {
      background: rgba(255, 255, 255, 0.035);
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .wheel {
      width: 112px;
      height: 246px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-snap-type: y mandatory;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 26%,
        black 74%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 26%,
        black 74%,
        transparent 100%
      );
    }

    .wheel::before,
    .wheel::after {
      content: "";
      display: block;
      height: 96px;
    }

    .minute-option {
      height: 54px;
      display: grid;
      place-items: center;
      scroll-snap-align: center;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: -0.06em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .picker-caption {
      margin-top: 20px;
      text-align: center;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .practice {
        grid-template-rows: 24px 136px 88px;
      }

      .result {
        margin-top: 28px;
      }
    }
  </style>
</head>

<body>
  <div id="timer" class="timer">12:00</div>

  <div class="page">
    <main class="practice" id="practice">
      <div class="label">Cálculo mental</div>
      <div id="operation" class="operation"></div>
      <div id="result" class="result"></div>
    </main>
  </div>

  <div id="hint" class="hint">tap</div>

  <div id="overlay" class="overlay">
    <div>
      <div id="wheel" class="wheel" aria-label="Seleccionar minutos"></div>
      <div class="picker-caption">minutos</div>
    </div>
  </div>

  <script>
    const operationEl = document.querySelector("#operation");
    const resultEl = document.querySelector("#result");
    const timerEl = document.querySelector("#timer");
    const hintEl = document.querySelector("#hint");
    const overlayEl = document.querySelector("#overlay");
    const wheelEl = document.querySelector("#wheel");

    const DEFAULT_MINUTES = 12;
    const MINUTES_MIN = 1;
    const MINUTES_MAX = 60;
    const LONG_PRESS_MS = 560;
    const OPTION_HEIGHT = 54;

    let selectedMinutes = DEFAULT_MINUTES;
    let remainingSeconds = selectedMinutes * 60;
    let current = null;
    let showingResult = false;
    let timerHidden = false;
    let timerInterval = null;
    let longPressTimer = null;
    let longPressTriggered = false;

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function renderTimer() {
      timerEl.textContent = formatTime(remainingSeconds);

      if (remainingSeconds === 0) {
        timerHidden = false;
        timerEl.classList.remove("hidden");
      }
    }

    function startTimer(seconds = selectedMinutes * 60) {
      clearInterval(timerInterval);
      remainingSeconds = seconds;
      renderTimer();

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
          renderTimer();
        }
      }, 1000);
    }

    function hideTimer() {
      if (remainingSeconds === 0) return;

      timerHidden = true;
      timerEl.classList.add("hidden");
    }

    function buildWheel() {
      wheelEl.innerHTML = "";

      for (let minute = MINUTES_MIN; minute <= MINUTES_MAX; minute += 1) {
        const option = document.createElement("div");
        option.className = "minute-option";
        option.textContent = minute;
        option.dataset.minute = String(minute);
        wheelEl.appendChild(option);
      }
    }

    function scrollWheelTo(minutes) {
      wheelEl.scrollTop = (minutes - MINUTES_MIN) * OPTION_HEIGHT;
    }

    function getWheelMinutes() {
      const index = Math.round(wheelEl.scrollTop / OPTION_HEIGHT);
      return Math.min(MINUTES_MAX, Math.max(MINUTES_MIN, index + MINUTES_MIN));
    }

    function openMinutePicker() {
      if (remainingSeconds !== 0) return;

      overlayEl.classList.add("open");
      requestAnimationFrame(() => scrollWheelTo(selectedMinutes));
    }

    function closeMinutePickerAndRestart() {
      if (!overlayEl.classList.contains("open")) return;

      selectedMinutes = getWheelMinutes();
      overlayEl.classList.remove("open");
      timerHidden = false;
      timerEl.classList.remove("hidden");
      startTimer(selectedMinutes * 60);
    }

    function createMultiplication() {
      const oneDigitByTwoDigits = Math.random() < 0.35;

      if (oneDigitByTwoDigits) {
        const a = randomInt(2, 9);
        const b = randomInt(10, 99);

        return {
          text: `${a} × ${b}`,
          result: a * b
        };
      }

      const a = randomInt(10, 99);
      const b = randomInt(10, 99);

      return {
        text: `${a} × ${b}`,
        result: a * b
      };
    }

    function createSubtraction() {
      const a = randomInt(20, 99);
      const b = randomInt(2, a - 1);

      return {
        text: `${a} − ${b}`,
        result: a - b
      };
    }

    function createOperation() {
      const isMultiplication = Math.random() < 0.8;

      return isMultiplication
        ? createMultiplication()
        : createSubtraction();
    }

    function showNewOperation() {
      current = createOperation();
      showingResult = false;

      operationEl.textContent = current.text;
      resultEl.textContent = "";
    }

    function advancePractice() {
      if (!showingResult) {
        resultEl.textContent = current.result;
        showingResult = true;
        return;
      }

      showNewOperation();
    }

    function toggleDarkMode(event) {
      event.stopPropagation();
      document.body.classList.toggle("dark");
    }

    document.body.addEventListener("click", (event) => {
      if (overlayEl.classList.contains("open")) return;
      if (event.target === timerEl || event.target === operationEl) return;

      advancePractice();
    });

    operationEl.addEventListener("click", toggleDarkMode);

    timerEl.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!longPressTriggered) {
        hideTimer();
      }

      longPressTriggered = false;
    });

    timerEl.addEventListener("pointerdown", () => {
      longPressTriggered = false;

      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        openMinutePicker();
      }, LONG_PRESS_MS);
    });

    timerEl.addEventListener("pointerup", () => {
      clearTimeout(longPressTimer);
    });

    timerEl.addEventListener("pointerleave", () => {
      clearTimeout(longPressTimer);
    });

    overlayEl.addEventListener("click", (event) => {
      if (event.target === overlayEl) {
        closeMinutePickerAndRestart();
      }
    });

    setTimeout(() => {
      hintEl.classList.add("hidden");
    }, 5000);

    buildWheel();
    showNewOperation();
    startTimer();
  </script>
</body>
</html>

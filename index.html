<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Operaciones</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #151515;
      --muted: #8a857c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      user-select: none;
      cursor: pointer;
    }

    main {
      width: min(90vw, 760px);
      text-align: center;
      padding: 32px;
    }

    .timer {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      right: 24px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-bottom: 46px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .operation {
      font-size: clamp(54px, 15vw, 132px);
      font-weight: 300;
      letter-spacing: -0.075em;
      line-height: 0.92;
    }

    .result {
      margin-top: 38px;
      font-size: clamp(34px, 9vw, 74px);
      font-weight: 300;
      letter-spacing: -0.055em;
      color: var(--muted);
      min-height: 1em;
    }
  </style>
</head>

<body>
  <div id="timer" class="timer">12:00</div>

  <main>
    <div class="label">Cálculo mental</div>
    <div id="operation" class="operation"></div>
    <div id="result" class="result"></div>
  </main>

  <script>
    const operationEl = document.querySelector("#operation");
    const resultEl = document.querySelector("#result");
    const timerEl = document.querySelector("#timer");

    const SESSION_SECONDS = 12 * 60;

    let current = null;
    let showingResult = false;
    let remainingSeconds = SESSION_SECONDS;

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function updateTimer() {
      timerEl.textContent = formatTime(remainingSeconds);

      if (remainingSeconds > 0) {
        remainingSeconds -= 1;
      }
    }

    function createMultiplication() {
      const oneDigitByTwoDigits = Math.random() < 0.35;

      if (oneDigitByTwoDigits) {
        const a = randomInt(2, 9);
        const b = randomInt(10, 99);

        return {
          text: `${a} × ${b}`,
          result: a * b
        };
      }

      const a = randomInt(10, 99);
      const b = randomInt(10, 99);

      return {
        text: `${a} × ${b}`,
        result: a * b
      };
    }

    function createSubtraction() {
      const a = randomInt(20, 99);
      const b = randomInt(2, a - 1);

      return {
        text: `${a} − ${b}`,
        result: a - b
      };
    }

    function createOperation() {
      const isMultiplication = Math.random() < 0.8;

      return isMultiplication
        ? createMultiplication()
        : createSubtraction();
    }

    function showNewOperation() {
      current = createOperation();
      showingResult = false;

      operationEl.textContent = current.text;
      resultEl.textContent = "";
    }

    function handleTap() {
      if (!showingResult) {
        resultEl.textContent = current.result;
        showingResult = true;
        return;
      }

      showNewOperation();
    }

    document.body.addEventListener("click", handleTap);

    showNewOperation();
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>

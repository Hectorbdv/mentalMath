<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Operaciones</title>

  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #171717;
      --muted: #8a857c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
    }

    body {
      display: grid;
      place-items: center;
      user-select: none;
      cursor: pointer;
    }

    main {
      width: min(90vw, 720px);
      text-align: center;
      padding: 32px;
    }

    .label {
      margin-bottom: 42px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .operation {
      font-size: clamp(56px, 15vw, 128px);
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.95;
    }

    .result {
      margin-top: 34px;
      font-size: clamp(34px, 9vw, 72px);
      font-weight: 400;
      letter-spacing: -0.04em;
      color: var(--muted);
      min-height: 1em;
    }

    .hint {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main>
    <div class="label">Cálculo mental</div>
    <div id="operation" class="operation"></div>
    <div id="result" class="result"></div>
  </main>

  <div class="hint">tap</div>

  <script>
    const operationEl = document.querySelector("#operation");
    const resultEl = document.querySelector("#result");

    let current = null;
    let showingResult = false;

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function createOperation() {
      const isMultiplication = Math.random() < 0.8;

      if (isMultiplication) {
        const a = randomInt(2, 12);
        const b = randomInt(2, 12);

        return {
          text: `${a} × ${b}`,
          result: a * b
        };
      }

      const a = randomInt(20, 99);
      const b = randomInt(2, a - 1);

      return {
        text: `${a} − ${b}`,
        result: a - b
      };
    }

    function showNewOperation() {
      current = createOperation();
      showingResult = false;

      operationEl.textContent = current.text;
      resultEl.textContent = "";
    }

    function handleTap() {
      if (!showingResult) {
        resultEl.textContent = current.result;
        showingResult = true;
        return;
      }

      showNewOperation();
    }

    document.body.addEventListener("click", handleTap);

    showNewOperation();
  </script>
</body>
</html>

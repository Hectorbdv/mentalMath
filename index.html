<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>app.dailyMath</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #151515;
      --muted: #8a857c;
      --panel: rgba(244, 241, 234, 0.82);
      --line: rgba(21, 21, 21, 0.14);
    }

    body.dark {
      --bg: #11100e;
      --ink: #f0ece3;
      --muted: #8e887d;
      --panel: rgba(17, 16, 14, 0.82);
      --line: rgba(240, 236, 227, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      transition: background-color 520ms ease, color 520ms ease;
    }

    body {
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .page {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(28px, env(safe-area-inset-top))
        max(26px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(26px, env(safe-area-inset-left));
    }

    .timer {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      right: max(24px, env(safe-area-inset-right));
      z-index: 20;
      padding: 10px 0 10px 18px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      opacity: 1;
      transition: opacity 320ms ease, color 520ms ease;
    }

    .timer.hidden {
      opacity: 0;
    }

    .practice {
      width: min(100%, 860px);
      text-align: center;
      display: grid;
      grid-template-rows: 150px 92px;
      align-items: center;
    }

    .operation {
      align-self: end;
      width: 100%;
      font-size: clamp(58px, 17vw, 148px);
      font-weight: 300;
      letter-spacing: -0.078em;
      line-height: 0.88;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: color 520ms ease, opacity 260ms ease;
    }

    .result {
      align-self: start;
      margin-top: 34px;
      font-size: clamp(34px, 8.5vw, 76px);
      font-weight: 300;
      letter-spacing: -0.055em;
      color: var(--muted);
      min-height: 1em;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transform: translateY(4px);
      transition:
        opacity 280ms ease,
        transform 280ms ease,
        color 520ms ease;
    }

    .result.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease;
    }

    body.dark .overlay {
      background: rgba(255, 255, 255, 0.035);
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .wheel-wrap {
      text-align: center;
    }

    .wheel {
      width: 124px;
      height: 246px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-snap-type: y mandatory;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 26%,
        black 74%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 26%,
        black 74%,
        transparent 100%
      );
    }

    .wheel::before,
    .wheel::after {
      content: "";
      display: block;
      height: 96px;
    }

    .wheel-option {
      height: 54px;
      display: grid;
      place-items: center;
      scroll-snap-align: center;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: -0.06em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .picker-caption {
      margin-top: 20px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .practice {
        grid-template-rows: 136px 88px;
      }

      .result {
        margin-top: 28px;
      }
    }
  </style>
</head>

<body>
  <div id="timer" class="timer">12:00</div>

  <div class="page">
    <main class="practice">
      <div id="operation" class="operation"></div>
      <div id="result" class="result"></div>
    </main>
  </div>

  <div id="overlay" class="overlay">
    <div class="wheel-wrap">
      <div id="wheel" class="wheel"></div>
      <div id="pickerCaption" class="picker-caption"></div>
    </div>
  </div>

  <script>
    const operationEl = document.querySelector("#operation");
    const resultEl = document.querySelector("#result");
    const timerEl = document.querySelector("#timer");
    const overlayEl = document.querySelector("#overlay");
    const wheelEl = document.querySelector("#wheel");
    const pickerCaptionEl = document.querySelector("#pickerCaption");

    const DEFAULT_MINUTES = 12;
    const MINUTES_MIN = 1;
    const MINUTES_MAX = 60;
    const LEVEL_MIN = 1;
    const LEVEL_MAX = 3;
    const LONG_PRESS_MS = 560;
    const OPTION_HEIGHT = 54;

    let selectedMinutes = DEFAULT_MINUTES;
    let selectedLevel = 1;
    let remainingSeconds = selectedMinutes * 60;
    let current = null;
    let showingResult = false;
    let timerInterval = null;
    let timerIsHidden = false;
    let pickerMode = null;
    let timerLongPress = null;
    let operationLongPress = null;
    let timerLongPressTriggered = false;
    let operationLongPressTriggered = false;

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function choose(weightedItems) {
      const total = weightedItems.reduce((sum, item) => sum + item.weight, 0);
      let value = Math.random() * total;

      for (const item of weightedItems) {
        value -= item.weight;
        if (value <= 0) return item.create();
      }

      return weightedItems[weightedItems.length - 1].create();
    }

    function randomDecimal(min, max, decimals = 1) {
      const factor = 10 ** decimals;
      return randomInt(min * factor, max * factor) / factor;
    }

    function cleanNumber(value) {
      const rounded = Math.round(value * 1000) / 1000;
      if (Number.isInteger(rounded)) return String(rounded);
      return String(rounded).replace(/0+$/, "").replace(/\.$/, "");
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function renderTimer() {
      timerEl.textContent = formatTime(remainingSeconds);

      if (remainingSeconds === 0) {
        timerIsHidden = false;
        timerEl.classList.remove("hidden");
      }
    }

    function startTimer(seconds = selectedMinutes * 60) {
      clearInterval(timerInterval);
      remainingSeconds = seconds;
      renderTimer();

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
          renderTimer();
        }
      }, 1000);
    }

    function toggleTimerVisibility() {
      if (remainingSeconds === 0) return;

      timerIsHidden = !timerIsHidden;
      timerEl.classList.toggle("hidden", timerIsHidden);
    }

    function buildWheel(min, max, formatter) {
      wheelEl.innerHTML = "";

      for (let value = min; value <= max; value += 1) {
        const option = document.createElement("div");
        option.className = "wheel-option";
        option.textContent = formatter(value);
        option.dataset.value = String(value);
        wheelEl.appendChild(option);
      }
    }

    function scrollWheelTo(value, min) {
      wheelEl.scrollTop = (value - min) * OPTION_HEIGHT;
    }

    function getWheelValue(min, max) {
      const index = Math.round(wheelEl.scrollTop / OPTION_HEIGHT);
      return Math.min(max, Math.max(min, index + min));
    }

    function openMinutePicker() {
      pickerMode = "minutes";
      pickerCaptionEl.textContent = "minutos";
      buildWheel(MINUTES_MIN, MINUTES_MAX, value => String(value));
      overlayEl.classList.add("open");
      timerIsHidden = false;
      timerEl.classList.remove("hidden");
      requestAnimationFrame(() => scrollWheelTo(selectedMinutes, MINUTES_MIN));
    }

    function openLevelPicker() {
      pickerMode = "level";
      pickerCaptionEl.textContent = "nivel";
      buildWheel(LEVEL_MIN, LEVEL_MAX, value => String(value));
      overlayEl.classList.add("open");
      requestAnimationFrame(() => scrollWheelTo(selectedLevel, LEVEL_MIN));
    }

    function closePicker() {
      if (!overlayEl.classList.contains("open")) return;

      if (pickerMode === "minutes") {
        selectedMinutes = getWheelValue(MINUTES_MIN, MINUTES_MAX);
        startTimer(selectedMinutes * 60);
      }

      if (pickerMode === "level") {
        selectedLevel = getWheelValue(LEVEL_MIN, LEVEL_MAX);
        showNewOperation();
      }

      pickerMode = null;
      overlayEl.classList.remove("open");
    }

    function multiplicationOneByTwo() {
      const a = randomInt(2, 9);
      const b = randomInt(10, 99);
      return { text: `${a} × ${b}`, result: a * b };
    }

    function multiplicationTwoByTwo() {
      const a = randomInt(10, 99);
      const b = randomInt(10, 99);
      return { text: `${a} × ${b}`, result: a * b };
    }

    function multiplicationUpToThreeDigits() {
      const a = randomInt(10, 999);
      const b = randomInt(2, 999);
      return { text: `${a} × ${b}`, result: a * b };
    }

    function multiplicationUpToFourDigits() {
      const a = Math.random() < 0.35 ? randomDecimal(10, 9999, 1) : randomInt(10, 9999);
      const b = Math.random() < 0.35 ? randomDecimal(2, 9999, 1) : randomInt(2, 9999);
      const result = Math.round(a * b * 1000) / 1000;
      return { text: `${cleanNumber(a)} × ${cleanNumber(b)}`, result: cleanNumber(result) };
    }

    function subtraction(minA, maxA) {
      const a = randomInt(minA, maxA);
      const b = randomInt(2, a - 1);
      return { text: `${a} − ${b}`, result: a - b };
    }

    function subtractionUpToFourDigits() {
      const a = Math.random() < 0.35 ? randomDecimal(100, 9999, 1) : randomInt(100, 9999);
      const b = Math.random() < 0.35 ? randomDecimal(2, Math.floor(a) - 1, 1) : randomInt(2, Math.floor(a) - 1);
      const result = Math.round((a - b) * 1000) / 1000;
      return { text: `${cleanNumber(a)} − ${cleanNumber(b)}`, result: cleanNumber(result) };
    }

    function squareRootIntegerResult() {
      const root = randomInt(2, 999);
      const value = root * root;
      return { text: `√${value}`, result: root };
    }

    function squareRootDecimalResult() {
      const root = randomDecimal(2, 999, 1);
      const value = Math.round(root * root * 1000) / 1000;
      return { text: `√${cleanNumber(value)}`, result: cleanNumber(root) };
    }

    function createLevelOneOperation() {
      return choose([
        { weight: 64, create: () => multiplicationTwoByTwo() },
        { weight: 16, create: () => multiplicationOneByTwo() },
        { weight: 20, create: () => subtraction(20, 99) }
      ]);
    }

    function createLevelTwoOperation() {
      return choose([
        { weight: 60, create: () => multiplicationUpToThreeDigits() },
        { weight: 25, create: () => subtraction(100, 999) },
        { weight: 15, create: () => squareRootIntegerResult() }
      ]);
    }

    function createLevelThreeOperation() {
      return choose([
        { weight: 48, create: () => multiplicationUpToFourDigits() },
        { weight: 27, create: () => subtractionUpToFourDigits() },
        { weight: 25, create: () => squareRootDecimalResult() }
      ]);
    }

    function createOperation() {
      if (selectedLevel === 1) return createLevelOneOperation();
      if (selectedLevel === 2) return createLevelTwoOperation();
      return createLevelThreeOperation();
    }

    function showNewOperation() {
      current = createOperation();
      showingResult = false;

      operationEl.textContent = current.text;
      resultEl.textContent = "";
      resultEl.classList.remove("visible");
    }

    function showResult() {
      resultEl.textContent = current.result;
      requestAnimationFrame(() => {
        resultEl.classList.add("visible");
      });
      showingResult = true;
    }

    function advancePractice() {
      if (!showingResult) {
        showResult();
        return;
      }

      showNewOperation();
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    document.body.addEventListener("click", (event) => {
      if (overlayEl.classList.contains("open")) return;
      if (event.target === timerEl || event.target === operationEl) return;

      advancePractice();
    });

    timerEl.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!timerLongPressTriggered) {
        toggleTimerVisibility();
      }

      timerLongPressTriggered = false;
    });

    timerEl.addEventListener("pointerdown", () => {
      timerLongPressTriggered = false;

      timerLongPress = setTimeout(() => {
        timerLongPressTriggered = true;
        openMinutePicker();
      }, LONG_PRESS_MS);
    });

    timerEl.addEventListener("pointerup", () => {
      clearTimeout(timerLongPress);
    });

    timerEl.addEventListener("pointerleave", () => {
      clearTimeout(timerLongPress);
    });

    operationEl.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!operationLongPressTriggered) {
        toggleDarkMode();
      }

      operationLongPressTriggered = false;
    });

    operationEl.addEventListener("pointerdown", () => {
      operationLongPressTriggered = false;

      operationLongPress = setTimeout(() => {
        operationLongPressTriggered = true;
        openLevelPicker();
      }, LONG_PRESS_MS);
    });

    operationEl.addEventListener("pointerup", () => {
      clearTimeout(operationLongPress);
    });

    operationEl.addEventListener("pointerleave", () => {
      clearTimeout(operationLongPress);
    });

    overlayEl.addEventListener("click", (event) => {
      if (event.target === overlayEl) {
        closePicker();
      }
    });

    showNewOperation();
    startTimer();
  </script>
</body>
</html>

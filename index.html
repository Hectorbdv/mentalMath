<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>app.dailyMath</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #151515;
      --muted: #8a857c;
      --panel: rgba(244, 241, 234, 0.82);
      --line: rgba(21, 21, 21, 0.14);
    }

    body.dark {
      --bg: #11100e;
      --ink: #f0ece3;
      --muted: #8e887d;
      --panel: rgba(17, 16, 14, 0.82);
      --line: rgba(240, 236, 227, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      transition: background-color 520ms ease, color 520ms ease;
    }

    body {
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .page {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(28px, env(safe-area-inset-top))
        max(26px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(26px, env(safe-area-inset-left));
    }

    .timer {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      right: max(24px, env(safe-area-inset-right));
      z-index: 20;
      padding: 10px 0 10px 18px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      opacity: 1;
      transition: opacity 320ms ease, color 520ms ease;
    }

    .timer.hidden {
      opacity: 0;
    }

    .practice {
      width: min(100%, 860px);
      text-align: center;
      display: grid;
      grid-template-rows: 150px 92px;
      align-items: center;
    }

    .operation {
      align-self: end;
      width: 100%;
      font-size: clamp(58px, 17vw, 148px);
      font-weight: 300;
      letter-spacing: -0.078em;
      line-height: 0.88;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: color 520ms ease, opacity 260ms ease;
    }

    .result {
      align-self: start;
      margin-top: 34px;
      font-size: clamp(34px, 8.5vw, 76px);
      font-weight: 300;
      letter-spacing: -0.055em;
      color: var(--muted);
      min-height: 1em;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transform: translateY(4px);
      transition:
        opacity 280ms ease,
        transform 280ms ease,
        color 520ms ease;
    }

    .result.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease;
    }

    body.dark .overlay {
      background: rgba(255, 255, 255, 0.035);
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .wheel-wrap {
      text-align: center;
    }

    .wheel {
      width: 124px;
      height: 246px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-snap-type: y mandatory;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 26%,
        black 74%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 26%,
        black 74%,
        transparent 100%
      );
    }

    .wheel::before,
    .wheel::after {
      content: "";
      display: block;
      height: 96px;
    }

    .wheel-option {
      height: 54px;
      display: grid;
      place-items: center;
      scroll-snap-align: center;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: -0.06em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .picker-caption {
      margin-top: 20px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .practice {
        grid-template-rows: 136px 88px;
      }

      .result {
        margin-top: 28px;
      }
    }
  </style>
</head>

<body>
  <div id="timer" class="timer">12:00</div>

  <div class="page">
    <main class="practice">
      <div id="operation" class="operation"></div>
      <div id="result" class="result"></div>
    </main>
  </div>

  <div id="overlay" class="overlay">
    <div class="wheel-wrap">
      <div id="wheel" class="wheel"></div>
      <div id="pickerCaption" class="picker-caption"></div>
    </div>
  </div>

  <script>
    const operationEl = document.querySelector("#operation");
    const resultEl = document.querySelector("#result");
    const timerEl = document.querySelector("#timer");
    const overlayEl = document.querySelector("#overlay");
    const wheelEl = document.querySelector("#wheel");
    const pickerCaptionEl = document.querySelector("#pickerCaption");

    const DEFAULT_MINUTES = 12;
    const MINUTES_MIN = 1;
    const MINUTES_MAX = 60;
    const LEVEL_MIN = 1;
    const LEVEL_MAX = 7;
    const LONG_PRESS_MS = 560;
    const OPTION_HEIGHT = 54;

    let selectedMinutes = DEFAULT_MINUTES;
    let selectedLevel = 1;
    let remainingSeconds = selectedMinutes * 60;
    let current = null;
    let showingResult = false;
    let timerInterval = null;
    let timerIsHidden = false;
    let pickerMode = null;
    let timerLongPress = null;
    let operationLongPress = null;
    let timerLongPressTriggered = false;
    let operationLongPressTriggered = false;

    const levelLabels = {
      1: "nivel 1",
      2: "nivel 2",
      3: "nivel 3",
      4: "nivel 4",
      5: "nivel 5",
      6: "nivel 6",
      7: "nivel 7"
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randomDecimal(min, max, decimals = 1) {
      const factor = 10 ** decimals;
      return randomInt(min * factor, max * factor) / factor;
    }

    function cleanNumber(value) {
      return Number.isInteger(value) ? String(value) : value.toFixed(1);
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function renderTimer() {
      timerEl.textContent = formatTime(remainingSeconds);

      if (remainingSeconds === 0) {
        timerIsHidden = false;
        timerEl.classList.remove("hidden");
      }
    }

    function startTimer(seconds = selectedMinutes * 60) {
      clearInterval(timerInterval);
      remainingSeconds = seconds;
      renderTimer();

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
          renderTimer();
        }
      }, 1000);
    }

    function toggleTimerVisibility() {
      if (remainingSeconds === 0) return;

      timerIsHidden = !timerIsHidden;
      timerEl.classList.toggle("hidden", timerIsHidden);
    }

    function buildWheel(min, max, formatter) {
      wheelEl.innerHTML = "";

      for (let value = min; value <= max; value += 1) {
        const option = document.createElement("div");
        option.className = "wheel-option";
        option.textContent = formatter(value);
        option.dataset.value = String(value);
        wheelEl.appendChild(option);
      }
    }

    function scrollWheelTo(value, min) {
      wheelEl.scrollTop = (value - min) * OPTION_HEIGHT;
    }

    function getWheelValue(min, max) {
      const index = Math.round(wheelEl.scrollTop / OPTION_HEIGHT);
      return Math.min(max, Math.max(min, index + min));
    }

    function openMinutePicker() {
      pickerMode = "minutes";
      pickerCaptionEl.textContent = "minutos";
      buildWheel(MINUTES_MIN, MINUTES_MAX, value => String(value));
      overlayEl.classList.add("open");
      timerIsHidden = false;
      timerEl.classList.remove("hidden");
      requestAnimationFrame(() => scrollWheelTo(selectedMinutes, MINUTES_MIN));
    }

    function openLevelPicker() {
      pickerMode = "level";
      pickerCaptionEl.textContent = "complejidad";
      buildWheel(LEVEL_MIN, LEVEL_MAX, value => String(value));
      overlayEl.classList.add("open");
      requestAnimationFrame(() => scrollWheelTo(selectedLevel, LEVEL_MIN));
    }

    function closePicker() {
      if (!overlayEl.classList.contains("open")) return;

      if (pickerMode === "minutes") {
        selectedMinutes = getWheelValue(MINUTES_MIN, MINUTES_MAX);
        startTimer(selectedMinutes * 60);
      }

      if (pickerMode === "level") {
        selectedLevel = getWheelValue(LEVEL_MIN, LEVEL_MAX);
        showNewOperation();
      }

      pickerMode = null;
      overlayEl.classList.remove("open");
    }

    function multiplicationOneByTwo() {
      const a = randomInt(2, 9);
      const b = randomInt(10, 99);
      return { text: `${a} × ${b}`, result: a * b };
    }

    function multiplicationTwoByTwo(min = 10, max = 99) {
      const a = randomInt(min, max);
      const b = randomInt(min, max);
      return { text: `${a} × ${b}`, result: a * b };
    }

    function subtraction(minA, maxA, minB = 2) {
      const a = randomInt(minA, maxA);
      const b = randomInt(minB, a - 1);
      return { text: `${a} − ${b}`, result: a - b };
    }

    function squareRoot() {
      const root = randomInt(4, 30);
      const value = root * root;
      return { text: `√${value}`, result: root };
    }

    function decimalOperation() {
      const a = randomDecimal(12, 99, 1);
      const b = randomDecimal(2, Math.floor(a) - 1, 1);
      const result = Math.round((a - b) * 10) / 10;
      return { text: `${cleanNumber(a)} − ${cleanNumber(b)}`, result: cleanNumber(result) };
    }

    function divisionExact() {
      const result = randomInt(6, 40);
      const divisor = randomInt(2, 12);
      const dividend = result * divisor;
      return { text: `${dividend} ÷ ${divisor}`, result };
    }

    function mixedThreeTerm() {
      const a = randomInt(10, 99);
      const b = randomInt(2, 9);
      const c = randomInt(10, 99);
      return { text: `${a} + ${b} × ${c}`, result: a + b * c };
    }

    function createMultiplicationForLevel(level) {
      if (level === 1) {
        return Math.random() < 0.35 ? multiplicationOneByTwo() : multiplicationTwoByTwo();
      }

      if (level === 2) {
        return Math.random() < 0.5 ? multiplicationTwoByTwo(10, 99) : multiplicationOneByTwo();
      }

      if (level === 3) {
        return multiplicationTwoByTwo(20, 99);
      }

      if (level === 4) {
        return Math.random() < 0.5 ? multiplicationTwoByTwo(30, 99) : divisionExact();
      }

      if (level === 5) {
        return Math.random() < 0.45 ? multiplicationTwoByTwo(50, 140) : squareRoot();
      }

      if (level === 6) {
        return Math.random() < 0.5 ? mixedThreeTerm() : multiplicationTwoByTwo(80, 180);
      }

      return Math.random() < 0.4 ? mixedThreeTerm() : multiplicationTwoByTwo(120, 260);
    }

    function createSubtractionForLevel(level) {
      if (level === 1) return subtraction(20, 99);
      if (level === 2) return subtraction(50, 180);
      if (level === 3) return subtraction(100, 400);
      if (level === 4) return decimalOperation();
      if (level === 5) return subtraction(300, 999);
      if (level === 6) return decimalOperation();
      return subtraction(1000, 5000);
    }

    function createOperation() {
      const isMultiplicationFamily = Math.random() < 0.8;

      return isMultiplicationFamily
        ? createMultiplicationForLevel(selectedLevel)
        : createSubtractionForLevel(selectedLevel);
    }

    function showNewOperation() {
      current = createOperation();
      showingResult = false;

      operationEl.textContent = current.text;
      resultEl.textContent = "";
      resultEl.classList.remove("visible");
    }

    function showResult() {
      resultEl.textContent = current.result;
      requestAnimationFrame(() => {
        resultEl.classList.add("visible");
      });
      showingResult = true;
    }

    function advancePractice() {
      if (!showingResult) {
        showResult();
        return;
      }

      showNewOperation();
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    document.body.addEventListener("click", (event) => {
      if (overlayEl.classList.contains("open")) return;
      if (event.target === timerEl || event.target === operationEl) return;

      advancePractice();
    });

    timerEl.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!timerLongPressTriggered) {
        toggleTimerVisibility();
      }

      timerLongPressTriggered = false;
    });

    timerEl.addEventListener("pointerdown", () => {
      timerLongPressTriggered = false;

      timerLongPress = setTimeout(() => {
        timerLongPressTriggered = true;
        openMinutePicker();
      }, LONG_PRESS_MS);
    });

    timerEl.addEventListener("pointerup", () => {
      clearTimeout(timerLongPress);
    });

    timerEl.addEventListener("pointerleave", () => {
      clearTimeout(timerLongPress);
    });

    operationEl.addEventListener("click", (event) => {
      event.stopPropagation();

      if (!operationLongPressTriggered) {
        toggleDarkMode();
      }

      operationLongPressTriggered = false;
    });

    operationEl.addEventListener("pointerdown", () => {
      operationLongPressTriggered = false;

      operationLongPress = setTimeout(() => {
        operationLongPressTriggered = true;
        openLevelPicker();
      }, LONG_PRESS_MS);
    });

    operationEl.addEventListener("pointerup", () => {
      clearTimeout(operationLongPress);
    });

    operationEl.addEventListener("pointerleave", () => {
      clearTimeout(operationLongPress);
    });

    overlayEl.addEventListener("click", (event) => {
      if (event.target === overlayEl) {
        closePicker();
      }
    });

    showNewOperation();
    startTimer();
  </script>
</body>
</html>
